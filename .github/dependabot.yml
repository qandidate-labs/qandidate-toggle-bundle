version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "widen"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      symfony:
        patterns:
          - "symfony/*"
      dev-tools:
        dependency-type: "development"
        exclude-patterns:
          - "symfony/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
