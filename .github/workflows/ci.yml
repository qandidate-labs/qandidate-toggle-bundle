name: "CI"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "master"
  push:
    branches:
      - "master"
  schedule:
    - cron: "37 13 * * 1"

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  tests:
    name: "Tests (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony-version }}, ${{ matrix.dependency-versions }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        symfony-version: # https://symfony.com/releases
          - "6.4"
          - "7.4"
          - "8.1"
        dependency-versions:
          - "highest"
        exclude:
          # Symfony 8 requires PHP 8.4 or later.
          - php-version: "8.2"
            symfony-version: "8.1"
          - php-version: "8.3"
            symfony-version: "8.1"
        include:
          # Test the lowest versions on the lowest PHP version only. Old
          # patch releases cause deprecations on newer PHP versions that
          # applications do not get.
          - php-version: "8.2"
            symfony-version: "6.4"
            dependency-versions: "lowest"
    env:
      SYMFONY_REQUIRE: "${{ matrix.symfony-version }}.*"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "none"
      - name: "Validate composer.json"
        run: "composer validate --strict --no-interaction --ansi"
      - name: "Install Symfony Flex"
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex
      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "${{ matrix.dependency-versions }}"
      - name: "Run tests"
        run: "make test"

  coding-standards:
    name: "Coding standards"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.5"
          coverage: "none"
      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "highest"
      - name: "Check coding standards"
        run: "make php-cs-fixer-ci"

  static-analysis:
    name: "Static analysis"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.5"
          coverage: "none"
      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "highest"
      - name: "Run PHPStan"
        run: "vendor/bin/phpstan analyse --no-progress --error-format=github"
